[phases.install]
cmds = ["python -m pip install -r requirements.txt"]

[phases.build]
cmds = [
  "python -c \"from sentence_transformers import SentenceTransformer; SentenceTransformer('paraphrase-multilingual-MiniLM-L12-v2'); print('Model cached!')\""
]

[start]
cmd = "uvicorn fasal_server:app --host 0.0.0.0 --port $PORT"

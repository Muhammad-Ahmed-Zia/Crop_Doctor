[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = [
  "python -c \"from sentence_transformers import SentenceTransformer; SentenceTransformer('paraphrase-multilingual-MiniLM-L12-v2'); print('Model cached during build!')\"",
  "python -c \"import chromadb; print('ChromaDB ready!')\""
]

[start]
cmd = "uvicorn fasal_server:app --host 0.0.0.0 --port $PORT"
